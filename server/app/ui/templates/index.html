{% extends "base.html" %}

{% block content %}
<header class="page-header">
  <h1>Banter</h1>
</header>

<nav class="filter-bar" aria-label="Filter by source">
  <a
    href="/"
    class="filter-btn{% if source is none %} active{% endif %}"
    hx-get="/ui/recordings"
    hx-target="#recordings-list"
    hx-swap="innerHTML"
    hx-push-url="/"
  >All</a>
  <a
    href="/?source=kid"
    class="filter-btn{% if source == 'kid' %} active{% endif %}"
    hx-get="/ui/recordings?source=kid"
    hx-target="#recordings-list"
    hx-swap="innerHTML"
    hx-push-url="true"
  >Kid</a>
  <a
    href="/?source=mom"
    class="filter-btn{% if source == 'mom' %} active{% endif %}"
    hx-get="/ui/recordings?source=mom"
    hx-target="#recordings-list"
    hx-swap="innerHTML"
    hx-push-url="true"
  >Mom</a>
  <a
    href="/?source=dad"
    class="filter-btn{% if source == 'dad' %} active{% endif %}"
    hx-get="/ui/recordings?source=dad"
    hx-target="#recordings-list"
    hx-swap="innerHTML"
    hx-push-url="true"
  >Dad</a>
</nav>

<div id="recordings-list">
  {% include "_recordings_list.html" %}
</div>

{% include "_devices_panel.html" %}
{% endblock %}
