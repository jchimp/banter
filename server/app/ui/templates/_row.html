<li class="recording" id="rec-{{ r.id }}">
  <div class="recording-meta">
    <span class="badge badge-{{ r.source }}">{{ r.source }} · {{ r.origin | origin_label }}</span>
    <span class="timestamp">{{ r.created_at | friendly_time }}</span>
    <span class="duration">{{ r.duration_ms | duration }}</span>
    <span class="play-count">played {{ r.play_count }}x</span>
  </div>
  <audio controls preload="none" src="/ui/recordings/{{ r.id }}/audio"></audio>
</li>
