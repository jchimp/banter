[project]
name = "banter-client"
version = "0.1.0"
description = "Banter kidbox client — buttons, mic, speaker, NeoPixel ring"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3",
    "pydantic-settings>=2.7.0",
]

[project.optional-dependencies]
# Installed on the Pi only. Keeps the dev/test environment importable off-hardware.
hardware = [
    "gpiozero>=2.0.1",
    "lgpio>=0.2.2.0",
    "adafruit-circuitpython-neopixel-spi>=1.0.5",
]
# Laptop/dev-box audio via PortAudio. Works on Linux, macOS and Windows.
dev-audio = [
    "sounddevice>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.9.0",
]

[project.scripts]
banter-client = "banter_client.__main__:main"
banter-demo = "banter_client.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["banter_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
